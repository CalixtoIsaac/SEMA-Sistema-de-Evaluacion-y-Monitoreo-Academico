<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEMA</title>

  <script src="/js/theme.js"></script>
  <!-- Sin sesión, de vuelta al login antes de pintar nada -->
  <script>try { if (!localStorage.getItem('app.token')) location.replace('/'); } catch (e) { location.replace('/'); }</script>

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/semaforo.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Menú principal">
      <div class="sidebar-brand">
        <span class="brand-mark sm" aria-hidden="true"><span data-icon="logo"></span></span>
        <span class="brand-name">SEMA</span>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-section">General</p>
        <a class="nav-link" href="#resumen" data-view="resumen"><span data-icon="home"></span>Menú principal</a>
        <a class="nav-link" href="#cargar" data-view="cargar"><span data-icon="upload"></span>Cargar datos</a>
        <a class="nav-link" href="#alumnos" data-view="alumnos"><span data-icon="users"></span>Alumnos</a>
        <a class="nav-link" href="#perfil" data-view="perfil"><span data-icon="user"></span>Perfil</a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <span class="avatar" id="userAvatar" aria-hidden="true"></span>
          <div class="user-meta">
            <strong id="userName"></strong>
            <span id="userHandle" class="muted"></span>
          </div>
        </div>
        <button class="btn btn-ghost btn-block nav-logout" id="logoutBtn" type="button">
          <span data-icon="logout"></span>Cerrar sesión
        </button>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon menu-btn" id="menuBtn" type="button"
                aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">
          <span data-icon="menu"></span>
        </button>
        <h1 class="topbar-title" id="pageTitle">Inicio</h1>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-icon" type="button" data-theme-toggle></button>
        </div>
      </header>

      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Orden de carga: utilidades → módulos → app.js (que los registra) -->
  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/js/ui-kit.js"></script>
  <script src="/js/graficas.js"></script>
  <script src="/js/orden-busqueda.js"></script>
  <script src="/js/riesgo.js"></script>
  <script src="/js/inicio.js"></script>
  <script src="/js/formulario.js"></script>
  <script src="/js/cargar.js"></script>
  <script src="/js/listas.js"></script>
  <script src="/js/detalle.js"></script>
  <script src="/js/alumnos.js"></script>
  <script src="/js/perfil.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
